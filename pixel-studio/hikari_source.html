function toPix(blink){const c=document.createElement('canvas');c.width=W*K;c.height=H*K;draw(c.getContext('2d'),blink);const s=document.createElement('canvas');s.width=W;s.height=H;const sx=s.getContext('2d');sx.imageSmoothingQuality='high';const m=document.createElement('canvas');m.width=W*2;m.height=H*2;m.getContext('2d').drawImage(c,0,0,W*2,H*2);sx.drawImage(m,0,0,W,H);return sx.getImageData(0,0,W,H).data}

const LI=PAL[0];
function build(blink){const d=toPix(blink),f=new Uint8ClampedArray(W*H*4),l=new Uint8ClampedArray(W*H*4),op=i=>d[i*4+3]>110;

 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(op(i))continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const X=x+a,Y=y+b;return X>=0&&Y>=0&&X<W&&Y<H&&op(Y*W+X)}))l.set([...LI,255],i*4)}
  return [f,l]}

for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=y/H*6,band=t|0,use=((x+y)&1)&&t-band>.5?band+1:band,k=Math.min(1,use/6);bg.set([A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k,255],(y*W+x)*4)}
let s=11;const rnd=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;for(let n=0;n<34;n++){const x=rnd()*W|0,y=rnd()*H*.6|0;bg.set([255,240,200,255],(y*W+x)*4)}
