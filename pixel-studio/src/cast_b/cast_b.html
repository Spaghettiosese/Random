// ---------- drawing ----------
function facePath(f){if(f.ang>=.9){const L=80-f.w,R=80+f.w,cw=f.cw;return `M${L},${f.mid} L${L+.4},${f.mid+8} C${L+1},${f.chin-12} ${80-cw-6},${f.chin-5} ${80-cw},${f.chin-.8} Q80,${f.chin+2.4} ${80+cw},${f.chin-.8} C${80+cw+6},${f.chin-5} ${R-1},${f.chin-12} ${R-.4},${f.mid+8} L${R},${f.mid} C${R},${f.top+9} ${80+f.w*.6},${f.top} 80,${f.top} C${80-f.w*.6},${f.top} ${L},${f.top+9} ${L},${f.mid} Z`}
 const L=80-f.w,R=80+f.w,cw=f.cw,ang=f.ang||0,top=f.top,chin=f.chin,mid=f.mid,jc=f.jc;
 const jx=ang*3; // angular jaw: pull lower control points in
 return `M${L},${mid} C${L},${mid+jc} ${80-cw-4+jx},${chin-4} ${80-cw+2},${chin-1.5} C${80-cw+8},${chin+1} ${80+cw-8},${chin+1} ${80+cw-2},${chin-1.5} C${80+cw+4-jx},${chin-4} ${R},${mid+jc} ${R},${mid} C${R},${top+9} ${80+f.w*.6},${top} 80,${top} C${80-f.w*.6},${top} ${L},${top+9} ${L},${mid} Z`}
const EXP={
 open:{top:8,bot:6,iy:.4,oy:0,is:1,pu:1},
 happy:{},
 shy:{top:7.6,bot:6,iy:.2,oy:.6,is:1.05,pu:.95},
 sad:{top:8,bot:6.8,iy:-1.4,oy:1.8,is:1.08,pu:.95},
 angry:{top:6.3,bot:5.6,iy:2.4,oy:-.8,is:.95,pu:.9},
 surprised:{top:11,bot:9,iy:0,oy:0,is:.8,pu:.72}
};
const BROW={ // [innerDY, outerDY, archDY] relative to browY ; extra raise
 open:[0,0,-1.5,0],happy:[-1.5,-1,-2.5,-1],shy:[-1.5,1,-2,0],sad:[-3.5,1.8,-2,0],angry:[3.2,-1.2,0,1],surprised:[-4.5,-4.5,-6.5,-3]
};
function draw(ctx,id,o){
 const c=C[id],P=Object.assign({},BASEP,c.P),x=ctx,sw=o.sway||0,br=o.br||0,e=o.expr;
 x.save();x.scale(K,K);x.lineJoin='round';x.lineCap='round';
 const path=(d,fill,w=1.1,col)=>{const p=new Path2D(d);if(fill){x.fillStyle=P[fill]||fill;x.fill(p)}if(w){x.strokeStyle=col?(P[col]||col):P.line;x.lineWidth=w;x.stroke(p)}return p};
 const line=(d,col,w)=>{x.strokeStyle=P[col]||col;x.lineWidth=w;x.stroke(new Path2D(d))};
 const ell=(cx,cy,rx,ry,fill,w=0,rot=0)=>{x.beginPath();x.ellipse(cx,cy,rx,ry,rot,0,7);if(fill){x.fillStyle=P[fill]||fill;x.fill()}if(w){x.strokeStyle=P.line;x.lineWidth=w;x.stroke()}};
 const E={path,line,ell,x,P,c,o,sw,br,e,id};
 const T=(dy,fn)=>{x.save();x.translate(0,dy);fn();x.restore()};
 // 1 back hair (moves with head)
 T(br,()=>ART[id].back(E));
 // 2 body (static) + neck
 ART[id].body(E);
 // 3 head
 T(br,()=>{
  const f=c.f,fp=facePath(f),L=80-f.w,R=80+f.w,ey=c.eyeY;
  if(c.ears){ell(L+.5,ey+5,3.2,5,'skin',1);ell(R-.5,ey+5,3.2,5,'skin',1);ell(L+1,ey+5.5,1.3,2.6,'skinS',0);ell(R-1,ey+5.5,1.3,2.6,'skinS',0)}
  path(fp,'skin',0);
  // face shading (crescent right/bottom) + under-hair shadow
  x.save();x.clip(new Path2D(fp));x.fillStyle=P.skinS;x.fill(new Path2D(fp));x.save();x.translate(-2.6,-1.8);x.fillStyle=P.skin;x.fill(new Path2D(fp));x.restore();
  x.fillStyle=P.skin;x.fillRect(L-2,f.top-4,2*f.w+4,0);x.restore();

  if(e==='shy'&&!c.old){for(const s of [-1,1])for(let k=0;k<3;k++)line(`M${80+s*(c.eyeX+4)-k*1.8+1},${ey+9} l-1.1,2.4`,'blush',.8)}

}
function eyes(E){const {x,P,c,o,e,path,line,ell}=E,ey=c.eyeY;
 for(const f of [-1,1]){ // f=-1 left eye (outer = -x)
  const cx=80+f*c.eyeX,w=c.eyeW*(e==='surprised'?1.06:1);
  const I=[cx-f*w,0],O=[cx+f*w,0];
  if(e==='happy'||o.blink){
   const y=ey+(e==='happy'?2.5:-.5);
   if(e==='happy'){line(`M${cx-f*w},${y+1.5} Q${cx},${y-8} ${cx+f*w},${y+1.5}`,'line',1.9);if(c.lash)line(`M${cx+f*w},${y+1.5} l${f*2.4},-1.4`,'line',1.2)}
   else{ const dy=e==='sad'?1:e==='angry'?-.5:0;line(`M${cx-f*w},${ey-.5+dy} Q${cx},${ey+4.2+dy} ${cx+f*w},${ey-.5+dy}`,'line',1.7);if(c.lash)line(`M${cx+f*w},${ey-.5+dy} l${f*2.6},-1.4`,'line',1.1)}
   continue}
  const p=EXP[e],iy=ey+p.iy,oy=ey+p.oy;
  const eh=c.eh||1,h=p.top*eh/.75,b=p.bot*eh/.75;
  const up=`M${cx-f*w},${iy} C${cx-f*w*.55},${ey-h+p.iy*.6} ${cx+f*w*.45},${ey-h+p.oy*.5} ${cx+f*w},${oy}`;
  const lo=`C${cx+f*w*.6},${ey+b} ${cx-f*w*.6},${ey+b} ${cx-f*w},${iy} Z`;
  const alm=new Path2D(up+' '+lo);
  x.fillStyle=P.white;x.fill(alm);
  x.save();x.clip(alm);
  let lx=0,ly=0.6;if(e==='shy'){lx=[2.6,2.2,2.8,3,2.4,2.2,2.6,3][o.mi%8]*(o.look||1);ly=1.6}
  if(e==='sad'){ly=1.4}
  const ir=c.irisR*p.is*(e==='surprised'?1:1),icx=cx+lx,icy=ey+ly+.6;
  ell(icx,icy,ir,ir*1.3,'iris',0);
  x.save();x.beginPath();x.ellipse(icx,icy,ir,ir*1.3,0,0,7);x.clip();ell(icx,icy-ir*.9,ir*1.2,ir*1.0,'irisD',0);ell(icx,icy+ir*1.15,ir*.9,ir*.35,'irisL',0);x.restore();
  ell(icx,icy+.4,ir*.52*p.pu,ir*.7*p.pu,'pupil',0);
  x.fillStyle=P.white;x.beginPath();x.arc(icx-f*1.7,icy-1.9,e==='surprised'?1.2:1.55,0,7);x.fill();x.beginPath();x.arc(icx+f*1.6,icy+2.2,.8,0,7);x.fill();
  if(e==='sad'){x.fillStyle=P.irisL;x.globalAlpha=.6;ell(cx,ey+b*.62,w*.8,1.2,'irisL',0);x.globalAlpha=1}
  if(c.lid){x.strokeStyle=P.skinS;x.lineWidth=c.lid*2;x.stroke(new Path2D(up))}
  x.restore();
  // upper lid line (thick), lashes
  line(up,'line',c.glasses?1.6:c.lash?2.1:1.7);
  if(c.lash&&!c.glasses)line(`M${cx+f*w},${oy} l${f*3},-1.8`,'line',1.2);
  line(`M${cx-f*w*.5},${ey+b*.74} Q${cx},${ey+b*.82} ${cx+f*w*.5},${ey+b*.74}`,'skinS',.7);
  if(e==='sad'&&o.tear){ell(cx+f*(w-1.5),ey+b+1.5+o.tear,1.1,1.6+o.tear*.3,'irisL',.6)}
  if(e==='shy'||c.old){}
 }
}
function mouth(E){const {x,P,c,o,e,path,line,ell}=E,my=108+c.mouthY,talk=o.talk&&o.mi%2===0,mc=c.mouthC;
 if(ART[E.id].noMouth){ART[E.id].mouth(E,talk);return}
 if(e==='happy'){ if(talk)path(`M74,${my-1} Q80,${my+10} 86,${my-1} Q80,${my+1.2} 74,${my-1} Z`,'mouthD',1);else line(`M74.5,${my-.5} Q80,${my+5.5} 85.5,${my-.5}`,mc,1.4);
  if(talk){x.save();x.clip(new Path2D(`M74,${my-1} Q80,${my+10} 86,${my-1} Z`));ell(80,my+6.5,3.2,2,'tongue',0);x.restore()} return}
 if(e==='surprised'){const r=talk?[2.6,4]:[2,3];ell(80,my+2.5,r[0],r[1],'mouthD',1);ell(80,my+4.6,r[0]*.6,r[1]*.4,'tongue',0);return}
 if(e==='shy'){ if(talk){ell(80,my+1.5,2.2,2.2,'mouthD',1);ell(80,my+2.6,1.3,.9,'tongue',0)}else line(`M77,${my+.6} q1.5,1.5 3,0 q1.5,-1.5 3,0`,mc,1.2); return}
 if(e==='sad'){ if(talk){ell(80,my+2,2.6,2.4,'mouthD',1)}else line(`M76,${my+2.5} Q80,${my-.8} 84,${my+2.5}`,mc,1.3); return}
 if(e==='angry'){ if(talk){path(`M74.5,${my+.5} L85.5,${my+.5} Q84,${my+7} 80,${my+7} Q76,${my+7} 74.5,${my+.5} Z`,'mouthD',1);x.save();x.clip(new Path2D(`M74.5,${my+.5} L85.5,${my+.5} Q84,${my+7} 80,${my+7} Q76,${my+7} 74.5,${my+.5} Z`));x.fillStyle=P.white;x.fillRect(74,my+.5,12,1.8);x.restore()}else line(`M75,${my+2.4} Q80,${my-.2} 85,${my+2.4}`,mc,1.4); return}
 // open / neutral
 if(talk){path(`M75,${my} Q80,${my+9} 85,${my} Q80,${my+1.4} 75,${my} Z`,'mouthD',1);x.save();x.clip(new Path2D(`M75,${my} Q80,${my+9} 85,${my} Z`));ell(80,my+6,3,2,'tongue',0);x.restore()}
 else line(`M75.5,${my} Q80,${my+4.2} 84.5,${my}`,mc,1.35);
}
function brows(E,col,w,dx=0,dyAll=0){const {c,e}=E,B=BROW[e],by=c.browY+dyAll;
 for(const f of [-1,1]){const cx=80+f*c.eyeX;
  const ix=cx-f*(c.eyeW-1.5),ox=cx+f*(c.eyeW+2.5);
  const iy=by+B[0],oy=by+B[1],ay=by+B[2]-(c.old?0:0)+(B[3]||0)*0;
  E.line(`M${ix},${iy} Q${cx},${ay-.2} ${ox},${oy}`,col,w)}
}
function glasses(E,kind){const {x,P,c,e}=E,ey=c.eyeY,fr=P.frame;

  let d;

  else{d=`M${cx-10.5},${ey-8} L${cx+10.5},${ey-9.5} L${cx+9.5},${ey+6} Q${cx+8},${ey+8.5} ${cx+5},${ey+8.5} L${cx-6},${ey+8.5} Q${cx-10},${ey+8} ${cx-10.5},${ey+4} Z`}
  x.globalAlpha=.16;x.fillStyle='#ffffff';x.fill(new Path2D(d));x.globalAlpha=1;
  x.strokeStyle=fr;x.lineWidth=kind==='round'?1.25:1.1;x.stroke(new Path2D(d));
  x.strokeStyle='#ffffff';x.globalAlpha=.8;x.lineWidth=1;x.beginPath();x.moveTo(cx+f*-2+3,ey-7.5);x.lineTo(cx+f*-2-1,ey-3);x.stroke();x.globalAlpha=1;
  }
 E.line(`M${80-c.eyeX+10.5},${ey-4} Q80,${ey-6.5} ${80+c.eyeX-10.5},${ey-4}`,fr,1.2);
}

  path('M76,141 L84,141 L83,148 L77,148 Z','tie',1);path('M77,148 L83,148 L86,184 L80,190 L74,184 Z','tie',1);path('M81,148 L83,148 L86,184 L80,190 Z','tieS',0);

 },
